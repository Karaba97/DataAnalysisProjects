<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE45C">
<title>Fuel Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <header class="hero" id="hero">
    <div class="hero-top">
      <span class="chip" id="date">Thu 19 Nov</span>
      <span class="chip" id="dayChip">Day 1 🔥</span>
    </div>
    <div class="hero-row">
      <div class="sky" id="sky" aria-hidden="true">☀️</div>
      <div>
        <h1 id="greeting">Yo Trev!</h1>
        <p class="sub" id="subGreeting"></p>
      </div>
    </div>
  </header>

  <section class="debt sticker" id="debt" hidden>
    <span class="debt-emoji">🐌</span>
    <div><b id="debtTitle"></b><span id="debtText"></span></div>
  </section>

  <section class="card gauge-card tilt-l">
    <div class="card-head">
      <h2>Fuel tank</h2>
      <span class="pill" id="calPill"></span>
    </div>
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 130" class="gauge" aria-hidden="true">
        <path d="M22 115 A88 88 0 0 1 198 115" class="gauge-track"/>
        <path d="M22 115 A88 88 0 0 1 198 115" class="gauge-fill" id="calArc"/>
        <g id="needle" class="needle">
          <line x1="110" y1="115" x2="110" y2="46"/>
        </g>
        <circle cx="110" cy="115" r="17" class="hub"/>
        <text x="110" y="122" class="hub-face" id="hubFace" text-anchor="middle">😋</text>
      </svg>
      <div class="big" id="calLeftBig">610</div>
      <div class="big-label" id="calLeftLabel">cal left</div>
      <div class="eaten"><span id="calEaten"></span> eaten of <span id="calTarget"></span></div>
    </div>
  </section>

  <section class="card action tilt-r" id="actionCard">
    <div class="action-emoji" id="actionEmoji">🍗</div>
    <div class="action-body">
      <h2 id="actionTitle"></h2>
      <p id="actionText"></p>
    </div>
  </section>

  <section class="duo">
    <div class="card mini">
      <div class="mini-top"><span class="mini-icon">🥩</span><h2>Protein</h2></div>
      <div class="mini-num"><span id="protEaten">0</span><small>/<span id="protTarget">140</span>g</small></div>
      <div class="bar"><div class="bar-fill" id="protBar"></div></div>
      <div class="mini-foot" id="protFoot"></div>
    </div>
    <div class="card mini">
      <div class="mini-top"><span class="mini-icon">👟</span><h2>Steps</h2></div>
      <div class="mini-num"><span id="steps">0</span></div>
      <div class="bar"><div class="bar-fill steps-fill" id="stepBar"></div></div>
      <div class="mini-foot" id="stepFoot"></div>
    </div>
  </section>

  <section class="coach">
    <div class="coach-face" aria-hidden="true">🦒</div>
    <div class="bubble"><p id="coach"></p></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Today's grub</h2>
      <span class="pill soft" id="mealCount"></span>
    </div>
    <ul class="meals" id="meals"></ul>
  </section>

  <p class="footer-note">Sneak peek · sample data</p>
</main>

<nav class="tabbar" aria-label="Main">
  <button class="tab active"><span>🏠</span>Today</button>
  <button class="tab add" aria-label="Log a meal"><span>＋</span></button>
  <button class="tab"><span>🏆</span>Wins</button>
</nav>

<script src="app.js"></script>
</body>
</html>
